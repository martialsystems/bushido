name: Bug report
description: Report a crash, sound problem or anything that doesn't work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. The more detail you give, the faster it can be fixed.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Critical: crash, data loss or no audio"
        - "High: a major feature is broken"
        - "Medium: something works wrong but there is a workaround"
        - "Low: cosmetic or minor"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 15.1 (Apple Silicon), Windows 11
    validations:
      required: true
  - type: input
    id: daw
    attributes:
      label: DAW and version
      placeholder: e.g. Ableton Live 12.1, Logic Pro 11, Reaper 7
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Plugin format
      options:
        - VST3
        - AU
        - AAX
        - Standalone
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load the plugin on a track
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, crash reports or screenshots (optional)
      render: text
